[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fmri-preprocessing-reference"
version = "0.1.0"
description = "Auditable fMRI preprocessing reference implementations"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "nibabel>=5.2", "pytest>=7.0", "matplotlib>=3.7", "jupyter>=1.0"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = "-ra"
